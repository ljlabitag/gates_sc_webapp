name = "gates-sc-webapp"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "gates-sc-webapp"
database_id = "61092e00-c9b5-4b62-8683-efd19e4d9c1f"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gates-sc-webapp"

# S3-compatible endpoint for the presign adapter (ops plan: build once against
# the plain S3 API so R2 now and MinIO later are a config swap, not a rewrite).
# The native BUCKET binding above stays in use for server-side operations
# (existence checks) — only presigning needs the S3 credentials, since
# generating a presigned URL is inherently an S3-protocol signing operation
# the native binding doesn't expose.
[vars]
R2_ENDPOINT = "https://c5f38af076958ae8289a040392373bec.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "gates-sc-webapp"
# Placeholder version stamp — the actual /privacy page (order-of-work item 8)
# doesn't exist yet and its content is still pending DOST privacy office
# review. Bump this whenever the real notice is drafted or revised; every
# consent record stores the version it was given under so what a person
# agreed to stays provable later.
PRIVACY_NOTICE_VERSION = "2026-08-13"
# INTERIM sender — dost.gov.ph's DNS is managed solely by DOST IT (no self-
# service access), so authenticating dostgates@notify.dost.gov.ph in Brevo is
# blocked on that request going through them. This Gmail address is verified
# in Brevo as a single sender (no domain auth needed) purely to prove the
# integration works end to end. Swap to dostgates@notify.dost.gov.ph — the
# real target, see brief §7 — the moment IT completes the DNS records; no
# other code changes needed when that happens.
MAIL_FROM = "ljlabitag.dostgates@gmail.com"
# Third backup location for proposal files (alongside R2 and the emailed
# attachment) — a publicly reachable MinIO instance on P4's shared internal
# infrastructure. Bucket is shared across P4 projects, hence the key prefix
# to namespace this hackathon's files within it. MINIO_ACCESS_KEY_ID/
# MINIO_SECRET_ACCESS_KEY are set as secrets once created — the backup
# skips itself (logs, doesn't throw) until then.
MINIO_ENDPOINT = "https://infra-s3-api.gates-staging.work"
MINIO_BUCKET_NAME = "p4-internal"
MINIO_KEY_PREFIX = "GATES GeoHack 2026/"

# Secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, BREVO_API_KEY,
# SECRETARIAT_EMAIL, ADMIN_USER, ADMIN_PASSWORD, SESSION_SECRET,
# MINIO_ACCESS_KEY_ID, MINIO_SECRET_ACCESS_KEY) are set via
# `wrangler secret put` — never committed here.

# Cost/abuse safeguard on POST /uploads/presign, POST /hackathon-submissions,
# and admin login: rate limiting implemented directly against D1 (see
# worker/src/lib/rateLimit.ts). The native `[[ratelimits]]` Workers binding
# was tried first but didn't enforce anything in testing — 30 rapid requests
# against a configured limit of 20 all succeeded, with no error to explain
# why — so this doesn't rely on it.

# Staging environment — a fully separate Worker/D1/R2 so `dev`-branch work can
# be deployed and tested (`wrangler deploy --env staging`) without touching
# production data or the live URL. Named-environment bindings do NOT inherit
# from the top-level config above, so every binding/var production has is
# re-declared here rather than assumed. Secrets are also per-environment
# (`wrangler secret put NAME --env staging`) and have not been set yet.
[env.staging]
name = "gates-sc-webapp-staging"

[env.staging.assets]
directory = "client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gates-sc-webapp-staging"
database_id = "fc2f89c8-f7f1-441d-bb8a-ed91bc537587"
migrations_dir = "drizzle/migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "gates-sc-webapp-staging"

[env.staging.vars]
R2_ENDPOINT = "https://c5f38af076958ae8289a040392373bec.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "gates-sc-webapp-staging"
PRIVACY_NOTICE_VERSION = "2026-08-13"
# Same interim Gmail sender as production — fine to share for staging since
# it's just proving the integration works, not sending anything real.
MAIL_FROM = "ljlabitag.dostgates@gmail.com"
# Same shared MinIO instance and bucket as production, but its own
# sub-prefix — staging test backups land in a clearly separate folder
# instead of mixing with real submission backups.
MINIO_ENDPOINT = "https://infra-s3-api.gates-staging.work"
MINIO_BUCKET_NAME = "p4-internal"
MINIO_KEY_PREFIX = "GATES GeoHack 2026/staging/"
