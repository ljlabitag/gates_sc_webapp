    <title>GATES Program 2nd Stakeholder Conference — October 15–16, 2026</title>

    />

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decodes the path that public/404.html encoded, so GitHub Pages deep links
      // (/program, /hackathon) land on the right route. Must run before the app
      // mounts. No-op on hosts that support rewrites.
      (function () {
        var l = window.location;
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
